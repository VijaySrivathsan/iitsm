# Default profile: in-memory H2. Used by tests and a plain `mvn spring-boot:run`.
spring:
  application:
    name: iitsm
  datasource:
    url: jdbc:h2:mem:itsm;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    # Keep the persistence context open while Thymeleaf renders, so lazy collections
    # (notes, skills) can be shown. Standard for server-rendered apps; see docs/decisions.md D18.
    open-in-view: true
  h2:
    console:
      enabled: false
  thymeleaf:
    cache: false

server:
  port: 8080

itsm:
  # Create demo accounts, services and categories on an empty database (bootstrap.DemoDataLoader)
  demo-data:
    enabled: true
    # Payment Gateway P1 gets a 2 min / 10 min SLA so escalation is visible within a short demo
    fast-payment-sla: true
  priority:
    # Which PriorityStrategy to use: weighted (default) or matrix
    strategy: weighted
  sla:
    # How often the background SLA monitor runs, and when an incident counts as "at risk"
    monitor-interval: PT20S
    risk-threshold: 0.75
  escalation:
    enabled: true
  duplicates:
    # Similarity (0-1) at which a new incident is flagged as a possible duplicate
    threshold: 0.5
