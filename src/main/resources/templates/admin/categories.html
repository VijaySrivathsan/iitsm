<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categories')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h4 mb-3">Incident categories</h1>
    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card"><div class="card-body p-0"><div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead class="table-light"><tr><th>Category</th><th>Description</th><th>Keywords</th><th>Active</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="c : ${categories}">
                        <form th:action="@{/admin/categories/{id}(id=${c.id})}" method="post" th:id="'cat' + ${c.id}"></form>
                        <td class="fw-semibold" th:text="${c.name}">name</td>
                        <td><input class="form-control form-control-sm" name="description" th:value="${c.description}" th:attr="form='cat' + ${c.id}" aria-label="Description"></td>
                        <td><input class="form-control form-control-sm" name="keywords" th:value="${c.keywords}" th:attr="form='cat' + ${c.id}" aria-label="Keywords"></td>
                        <td><input class="form-check-input" type="checkbox" name="active" value="true" th:checked="${c.active}" th:attr="form='cat' + ${c.id}" aria-label="Active"></td>
                        <td><button class="btn btn-sm btn-outline-primary" type="submit" th:attr="form='cat' + ${c.id}">Save</button></td>
                    </tr>
                    </tbody>
                </table>
            </div></div></div>
        </div>
        <div class="col-lg-4">
            <div class="card"><div class="card-header">Add a category</div><div class="card-body">
                <p class="small text-muted">New categories work immediately: no code change is needed.</p>
                <form th:action="@{/admin/categories}" th:object="${form}" method="post" novalidate>
                    <div class="mb-2">
                        <label class="form-label small" for="name">Name</label>
                        <input class="form-control form-control-sm" th:field="*{name}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small" for="description">Description</label>
                        <input class="form-control form-control-sm" th:field="*{description}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small" for="keywords">Keywords (comma separated)</label>
                        <input class="form-control form-control-sm" th:field="*{keywords}">
                    </div>
                    <button class="btn btn-sm btn-primary" type="submit">Add category</button>
                </form>
            </div></div>
        </div>
    </div>
</main>
</body>
</html>
