<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Outbox')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h4 mb-1">Email / SMS outbox</h1>
    <p class="text-muted">Messages handed to the simulated email and SMS gateways (Adapter pattern; no real messages are sent).</p>
    <div class="card"><div class="card-body p-0"><div class="table-responsive">
        <table class="table table-sm align-middle mb-0">
            <thead class="table-light"><tr><th>Time</th><th>Channel</th><th>To</th><th>Message</th></tr></thead>
            <tbody>
            <tr th:each="m : ${messages}">
                <td class="small text-nowrap" th:text="${@fmt.dateTime(m.sentAt)}">time</td>
                <td><span class="badge" th:classappend="${m.channel == 'SMS'} ? 'text-bg-warning' : 'text-bg-info'" th:text="${m.channel}">EMAIL</span></td>
                <td class="small" th:text="${m.to}">to</td>
                <td class="small"><strong th:if="${m.subject}" th:text="${m.subject}">subject</strong><div class="text-muted" style="white-space: pre-wrap" th:text="${m.body}">body</div></td>
            </tr>
            <tr th:if="${#lists.isEmpty(messages)}"><td colspan="4" class="text-center text-muted py-4">Nothing sent yet.</td></tr>
            </tbody>
        </table>
    </div></div></div>
</main>
</body>
</html>
