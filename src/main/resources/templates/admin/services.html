<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('IT services')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h4 mb-3">IT services</h1>
    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card"><div class="card-body p-0"><div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead class="table-light"><tr><th>Service</th><th>Description</th><th>Criticality</th><th>Active</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="s : ${services}">
                        <form th:action="@{/admin/services/{id}(id=${s.id})}" method="post" th:id="'svc' + ${s.id}"></form>
                        <td class="fw-semibold" th:text="${s.name}">name</td>
                        <td><input class="form-control form-control-sm" name="description" th:value="${s.description}" th:attr="form='svc' + ${s.id}" aria-label="Description"></td>
                        <td style="width: 110px"><select class="form-select form-select-sm" name="businessCriticality" th:attr="form='svc' + ${s.id}" aria-label="Criticality">
                            <option th:each="c : ${#numbers.sequence(1, 5)}" th:value="${c}" th:text="${c}" th:selected="${c == s.businessCriticality}">1</option>
                        </select></td>
                        <td><input class="form-check-input" type="checkbox" name="active" value="true" th:checked="${s.active}" th:attr="form='svc' + ${s.id}" aria-label="Active"></td>
                        <td><button class="btn btn-sm btn-outline-primary" type="submit" th:attr="form='svc' + ${s.id}">Save</button></td>
                    </tr>
                    </tbody>
                </table>
            </div></div></div>
        </div>
        <div class="col-lg-4">
            <div class="card"><div class="card-header">Add a service</div><div class="card-body">
                <form th:action="@{/admin/services}" th:object="${form}" method="post" novalidate>
                    <div class="mb-2">
                        <label class="form-label small" for="name">Name</label>
                        <input class="form-control form-control-sm" th:field="*{name}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small" for="description">Description</label>
                        <input class="form-control form-control-sm" th:field="*{description}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small" for="businessCriticality">Business criticality (1 = minor, 5 = critical)</label>
                        <input class="form-control form-control-sm" type="number" min="1" max="5" th:field="*{businessCriticality}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{businessCriticality}"></div>
                    </div>
                    <button class="btn btn-sm btn-primary" type="submit">Add service</button>
                </form>
            </div></div>
        </div>
    </div>
</main>
</body>
</html>
