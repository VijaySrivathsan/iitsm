<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Users')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h4 mb-3">Users &amp; technicians</h1>
    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card"><div class="card-body p-0"><div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead class="table-light"><tr><th>Username</th><th>Name</th><th>Role</th><th>Details</th><th>Status</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="u : ${users}">
                        <td class="fw-semibold" th:text="${u.username}">u</td>
                        <td th:text="${u.fullName}">name</td>
                        <td th:text="${u.role.label()}">role</td>
                        <td class="small text-muted">
                            <th:block th:if="${u.role.name() == 'TECHNICIAN'}">
                                <span th:each="s, it : ${u.skills}" th:text="${s.name} + (${it.last} ? '' : ', ')">skill</span>
                                <span th:text="' · max ' + ${u.maxWorkload}">max</span>
                                <span class="badge text-bg-info" th:if="${u.teamLead}">lead</span>
                                <span class="badge text-bg-secondary" th:unless="${u.available}">away</span>
                            </th:block>
                            <span th:if="${u.role.name() == 'EMPLOYEE'}" th:text="${u.department}">dept</span>
                            <span class="badge text-bg-dark" th:if="${u.role.name() == 'ADMIN' and u.itManager}">IT manager</span>
                        </td>
                        <td><span class="badge" th:classappend="${u.active} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${u.active} ? 'active' : 'disabled'">active</span></td>
                        <td class="text-end text-nowrap">
                            <a th:if="${u.role.name() == 'TECHNICIAN'}" class="btn btn-sm btn-outline-primary" th:href="@{/admin/technicians/{id}(id=${u.id})}">Edit</a>
                            <form class="d-inline" th:action="@{/admin/users/{id}/active(id=${u.id})}" method="post" th:if="${u.id != currentUser.id}">
                                <input type="hidden" name="active" th:value="${!u.active}">
                                <button class="btn btn-sm" th:classappend="${u.active} ? 'btn-outline-danger' : 'btn-outline-success'" type="submit" th:text="${u.active} ? 'Disable' : 'Enable'">Disable</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div></div></div>
        </div>
        <div class="col-lg-4">
            <div class="card"><div class="card-header">Add a user</div><div class="card-body">
                <form th:action="@{/admin/users}" th:object="${form}" method="post" novalidate>
                    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger small" th:each="e : ${#fields.globalErrors()}" th:text="${e}">error</div>
                    <div class="mb-2">
                        <label class="form-label small" for="role">Role</label>
                        <select class="form-select form-select-sm" th:field="*{role}" th:errorclass="is-invalid">
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r.label()}">role</option>
                        </select>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small" for="username">Username</label>
                        <input class="form-control form-control-sm" th:field="*{username}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{username}"></div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small" for="password">Initial password</label>
                        <input class="form-control form-control-sm" type="password" th:field="*{password}" th:errorclass="is-invalid" autocomplete="new-password">
                        <div class="invalid-feedback" th:errors="*{password}"></div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small" for="fullName">Full name</label>
                        <input class="form-control form-control-sm" th:field="*{fullName}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{fullName}"></div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small" for="email">Email</label>
                        <input class="form-control form-control-sm" type="email" th:field="*{email}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small" for="phone">Phone</label>
                        <input class="form-control form-control-sm" th:field="*{phone}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{phone}"></div>
                    </div>
                    <button class="btn btn-sm btn-primary" type="submit">Create user</button>
                </form>
            </div></div>
        </div>
    </div>
</main>
</body>
</html>
