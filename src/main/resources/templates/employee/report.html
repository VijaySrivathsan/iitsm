<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Report an incident')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h4 mb-3">Report an incident</h1>
    <div class="card"><div class="card-body">
        <form th:action="@{/employee/report}" th:object="${form}" method="post" novalidate>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="serviceId">Affected service *</label>
                    <select class="form-select" th:field="*{serviceId}" th:errorclass="is-invalid">
                        <option value="">Choose a service...</option>
                        <option th:each="s : ${services}" th:value="${s.id}" th:text="${s.name}">Service</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{serviceId}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="categoryId">Category</label>
                    <select class="form-select" th:field="*{categoryId}">
                        <option value="">Not sure (IT will classify it)</option>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">Category</option>
                    </select>
                    <div class="form-text">Choosing a category lets the system prioritise and assign it immediately.</div>
                    <div class="form-text text-info d-none" id="categoryHint"><i class="bi bi-magic me-1"></i><span></span></div>
                </div>
                <div class="col-12">
                    <label class="form-label" for="title">Short title</label>
                    <input class="form-control" th:field="*{title}" th:errorclass="is-invalid" placeholder="e.g. Payment application unavailable">
                    <div class="invalid-feedback" th:errors="*{title}"></div>
                </div>
                <div class="col-12">
                    <label class="form-label" for="description">What is happening? *</label>
                    <textarea class="form-control" rows="4" th:field="*{description}" th:errorclass="is-invalid"
                              placeholder="What were you doing, what did you expect, what happened instead?"></textarea>
                    <div class="invalid-feedback" th:errors="*{description}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="impact">Impact</label>
                    <select class="form-select" th:field="*{impact}">
                        <option th:each="v : ${impacts}" th:value="${v}" th:text="${v.label()}">Medium</option>
                    </select>
                    <div class="form-text">How much of the business is affected?</div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="urgency">Urgency</label>
                    <select class="form-select" th:field="*{urgency}">
                        <option th:each="v : ${urgencies}" th:value="${v}" th:text="${v.label()}">Medium</option>
                    </select>
                    <div class="form-text">How quickly must it be fixed?</div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="affectedUsers">Users affected</label>
                    <input class="form-control" type="number" min="1" th:field="*{affectedUsers}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{affectedUsers}"></div>
                </div>
            </div>
            <div class="mt-4">
                <button class="btn btn-primary" type="submit"><i class="bi bi-send me-1"></i>Submit incident</button>
                <a class="btn btn-link" th:href="@{/employee}">Cancel</a>
            </div>
        </form>
    </div></div>
</main>
<script>
    // Feature F: suggest a category from the description while the employee types.
    (function () {
        const text = document.getElementById('description');
        const title = document.getElementById('title');
        const select = document.getElementById('categoryId');
        const hint = document.getElementById('categoryHint');
        let timer;
        function ask() {
            const q = (title.value + ' ' + text.value).trim();
            if (q.length < 5) { return; }
            fetch('/api/suggest-category?text=' + encodeURIComponent(q), {credentials: 'same-origin'})
                .then(r => r.status === 200 ? r.json() : null)
                .then(s => {
                    if (!s) { hint.classList.add('d-none'); return; }
                    hint.querySelector('span').textContent = 'Suggested category: ' + s.name;
                    hint.classList.remove('d-none');
                    if (!select.value || select.dataset.auto === 'true') {
                        select.value = String(s.id);
                        select.dataset.auto = 'true';
                    }
                })
                .catch(() => hint.classList.add('d-none'));
        }
        select.addEventListener('change', () => { select.dataset.auto = 'false'; });
        [text, title].forEach(el => el.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(ask, 400); }));
    })();
</script>
</body>
</html>
