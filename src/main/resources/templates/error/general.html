<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Something went wrong')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="text-center py-5">
        <i class="bi bi-cloud-slash display-3 text-warning"></i>
        <h1 class="h3 mt-3">Something went wrong</h1>
        <p class="text-muted" th:text="${message}">Please try again.</p>
        <a class="btn btn-primary" th:href="@{/dashboard}">Back to my dashboard</a>
    </div>
</main>
</body>
</html>
