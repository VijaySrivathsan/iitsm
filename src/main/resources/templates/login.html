<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="main" class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="card auth-card mx-auto mt-4"><div class="card-body p-4 p-sm-5">
        <div class="auth-logo mb-3"><i class="bi bi-life-preserver"></i></div>
        <h1 class="h4 mb-1">Log in to I-ITSM</h1>
        <p class="text-muted small mb-4">Intelligent IT Service Management &amp; Incident Resolution</p>
        <div th:if="${param.error}" class="alert alert-danger">Invalid username or password, or the account is disabled.</div>
        <div th:if="${param.logout}" class="alert alert-info">You have been logged out.</div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input class="form-control form-control-lg" id="username" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary btn-lg w-100" type="submit"><i class="bi bi-box-arrow-in-right me-1"></i>Log in</button>
        </form>
        <p class="mt-3 mb-0 small text-muted">No account? <a th:href="@{/register}">Register as an employee</a>.</p>
    </div></div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
